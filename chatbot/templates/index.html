<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMenu AI</title>
    <style>
        :root {
            --bg: #f7f8fc;
            --card: rgba(255, 255, 255, 0.88);
            --text: #172033;
            --muted: #74809a;
            --accent: #ff6b35;
            --accent-dark: #e95421;
            --bot: #f1f3f8;
            --border: rgba(23, 32, 51, 0.08);
            --shadow: 0 24px 70px rgba(38, 48, 80, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 107, 53, 0.18), transparent 28%),
                radial-gradient(circle at 90% 90%, rgba(93, 95, 239, 0.14), transparent 30%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .app {
            width: min(960px, 100%);
            height: min(820px, calc(100vh - 48px));
            min-height: 620px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: var(--card);
            backdrop-filter: blur(22px);
            box-shadow: var(--shadow);
        }

        header {
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            font-size: 25px;
            background: linear-gradient(135deg, #ff8a4c, #ff4f2e);
            box-shadow: 0 10px 24px rgba(255, 107, 53, 0.25);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -0.4px;
        }

        .subtitle {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 11px;
            border-radius: 999px;
            color: #3d4962;
            background: #f4f6fa;
            font-size: 12px;
            font-weight: 700;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2dbb73;
            box-shadow: 0 0 0 4px rgba(45, 187, 115, 0.12);
        }

        #messages {
            overflow-y: auto;
            padding: 28px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 650px;
            margin: 35px auto;
            text-align: center;
        }

        .welcome-icon {
            font-size: 52px;
            margin-bottom: 8px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: -1px;
        }

        .welcome p {
            margin: 0 auto 20px;
            color: var(--muted);
            line-height: 1.6;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
        }

        .chip {
            border: 1px solid var(--border);
            background: white;
            color: #46516a;
            padding: 9px 13px;
            border-radius: 999px;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            transition: transform .15s ease, border-color .15s ease;
        }

        .chip:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 107, 53, .35);
        }

        .message-row {
            display: flex;
            margin: 14px 0;
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }

        .bubble {
            max-width: min(75%, 650px);
            padding: 13px 16px;
            border-radius: 19px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }

        .user .bubble {
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-bottom-right-radius: 6px;
        }

        .bot .bubble {
            background: var(--bot);
            border-bottom-left-radius: 6px;
        }

        .composer {
            padding: 18px 22px 22px;
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.72);
        }

        .input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 8px 17px;
            border: 1px solid rgba(23, 32, 51, .1);
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 28px rgba(30, 40, 70, .06);
        }

        #messageInput {
            flex: 1;
            border: 0;
            outline: 0;
            font: inherit;
            color: var(--text);
            background: transparent;
            min-width: 0;
        }

        #sendBtn {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 14px;
            color: white;
            background: var(--accent);
            cursor: pointer;
            font-size: 18px;
            transition: transform .15s ease, background .15s ease;
        }

        #sendBtn:hover {
            transform: translateY(-1px);
            background: var(--accent-dark);
        }

        #sendBtn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            margin: 9px 4px 0;
            color: var(--muted);
            text-align: center;
            font-size: 11px;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #929bb0;
            animation: bounce 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }

        @keyframes bounce {
            0%, 70%, 100% { transform: translateY(0); opacity: .55; }
            35% { transform: translateY(-4px); opacity: 1; }
        }

        @media (max-width: 650px) {
            body { padding: 0; }
            .app {
                height: 100vh;
                min-height: 0;
                border-radius: 0;
            }
            header { padding: 17px; }
            #messages { padding: 20px 15px; }
            .bubble { max-width: 88%; }
            .status { display: none; }
            .welcome h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="brand">
                <div class="logo">🍽️</div>
                <div>
                    <h1>FoodMenu AI</h1>
                    <p class="subtitle">Your smart food & menu assistant</p>
                </div>
            </div>
            <div class="status"><span class="dot"></span> Online</div>
        </header>

        <section id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🥗</div>
                <h2>What are you craving?</h2>
                <p>Ask me about food items, ingredients, nutrition, calories, protein, or menu choices.</p>
                <div class="chips">
                    <button class="chip" onclick="useSuggestion('What is a healthy breakfast?')">Healthy breakfast</button>
                    <button class="chip" onclick="useSuggestion('Tell me about pizza ingredients')">Pizza ingredients</button>
                    <button class="chip" onclick="useSuggestion('Which foods are high in protein?')">High-protein foods</button>
                    <button class="chip" onclick="useSuggestion('What are carbohydrates?')">Carbohydrates</button>
                </div>
            </div>
        </section>

        <footer class="composer">
            <div class="input-wrap">
                <input id="messageInput" type="text" placeholder="Ask a food or menu question..." autocomplete="off">
                <button id="sendBtn" aria-label="Send message">➤</button>
            </div>
            <div class="hint">FoodMenu AI answers food and menu-related questions only.</div>
        </footer>
    </main>

    <script>
        const messages = document.getElementById("messages");
        const input = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const welcome = document.getElementById("welcome");

        function addMessage(text, sender) {
            if (welcome) welcome.remove();

            const row = document.createElement("div");
            row.className = `message-row ${sender}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            row.appendChild(bubble);
            messages.appendChild(row);
            messages.scrollTop = messages.scrollHeight;
        }

        function addTyping() {
            if (welcome) welcome.remove();

            const row = document.createElement("div");
            row.className = "message-row bot";
            row.id = "typing";

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            const dots = document.createElement("div");
            dots.className = "typing";
            dots.innerHTML = "<span></span><span></span><span></span>";

            bubble.appendChild(dots);
            row.appendChild(bubble);
            messages.appendChild(row);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            document.getElementById("typing")?.remove();
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message || sendBtn.disabled) return;

            addMessage(message, "user");
            input.value = "";
            sendBtn.disabled = true;
            addTyping();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                removeTyping();
                addMessage(data.reply || "Sorry, I could not generate a response.", "bot");
            } catch (error) {
                removeTyping();
                addMessage("Unable to connect to the chatbot. Please try again.", "bot");
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function useSuggestion(text) {
            input.value = text;
            sendMessage();
        }

        sendBtn.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendMessage();
        });

        input.focus();
    </script>
</body>
</html>
